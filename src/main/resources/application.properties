# Application name (only for logs)
spring.application.name=springboot

# Port where the Spring Boot server will run
server.port=8080

# Show SQL queries executed by Hibernate
logging.level.org.hibernate.SQL=DEBUG

# Show actual parameter values in SQL queries
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE


# JDBC connection URL to your MySQL database
# useSSL=false disables SSL, serverTimezone=UTC avoids timezone errors
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/db_contacts?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC


# Username with access to the database
spring.datasource.username=adrian

# Password for the database user above
spring.datasource.password=123456

# MySQL JDBC driver class used by Spring Boot
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Specifies the SQL dialect Hibernate should use for MySQL 8
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# How Hibernate handles the database schema
# update = creates or updates tables based on your entities
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries generated by Hibernate in the console
spring.jpa.show-sql=true

# Format SQL queries for better readability in the console
spring.jpa.properties.hibernate.format_sql=true

# Disable Hibernate's Open Session in View (recommended for REST APIs)
# Improves performance and prevents unexpected queries
spring.jpa.open-in-view=false

# Kafka configuration
spring.kafka.bootstrap-servers=localhost:29092
spring.kafka.consumer.group-id=example-group-002
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer